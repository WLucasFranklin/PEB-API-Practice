<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title or "Flask JWT Lab" }}</title>

    <style>
        body {
            background-color: #000000;
            color: #40a837;
            font-family: "Courier New", Courier, monospace;
            padding: 20px;
        }
        .api-key-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 700px;
            margin-top: 10px;
        }


        .api-key-table th,
        .api-key-table td {
            border: 1px solid #40a837;
            padding: 8px 12px;
            text-align: left;
        }

        .api-key-table th {
            background: #111111;
        }

        .api-key-table tr:nth-child(even) {
            background: #2b2b2b;
        }

        a {
            color: #40a837;
        }

        .danger-button {
            padding: 4px 8px;
            cursor: pointer;
        }
        
        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid #40a837;
            border-radius: 10px;
            text-align: center;
        }

        .github-login {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>



</html>
